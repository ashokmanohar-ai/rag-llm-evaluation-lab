name: Offline RAG Regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: hashing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: rag-eval index build
      - run: rag-eval run --dataset data/evaluation/retrieval.jsonl
      - run: rag-eval run --dataset data/evaluation/qa.jsonl
      - run: rag-eval baseline compare --dataset data/evaluation/qa.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rag-evaluation-report
          path: reports/

