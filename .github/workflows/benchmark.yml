name: Manual RAG Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: rag-eval benchmark | tee benchmark.txt
        env:
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: hashing
      - uses: actions/upload-artifact@v4
        with:
          name: rag-benchmark
          path: benchmark.txt

