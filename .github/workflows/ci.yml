name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: MyPy
        run: mypy src tests
      - name: Unit, retrieval, evaluation, and security tests
        run: pytest
        env:
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: hashing
      - name: Offline index and smoke query
        run: |
          rag-eval index build
          rag-eval query "How many days of annual leave do employees receive?"
        env:
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: hashing

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rag-llm-evaluation-lab:ci

