chunking:
  strategy: recursive
  chunk_size: 600
  chunk_overlap: 100

embeddings:
  provider: auto
  model: all-MiniLM-L6-v2
  dimensions: 384

retrieval:
  mode: hybrid
  dense_top_k: 20
  sparse_top_k: 20
  final_top_k: 5
  rrf_constant: 60
  minimum_score: 0.0
  exclude_statuses: [SUPERSEDED, DRAFT]

reranking:
  enabled: true
  backend: lexical
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  candidate_k: 20
  final_k: 5

context:
  max_tokens: 6000
  near_duplicate_threshold: 0.92

generation:
  provider: mock
  model: deterministic-extractive-v1
  temperature: 0
  prompt_version: grounded-answer-v1

